services:
  backend:
    build: .
    container_name: type-club-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    networks:
      - type-club-net

  collab-server:
    build:
      context: .
      dockerfile: services/collab-server/Dockerfile
    container_name: type-club-collab
    restart: unless-stopped
    environment:
      - PORT=8001
      - BACKEND_URL=http://type-club-backend:8000
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
    networks:
      - type-club-net

networks:
  type-club-net:
    external: true
    name: type-club-net
