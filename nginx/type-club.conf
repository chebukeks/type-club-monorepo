# ── Bot detection for OG meta / link previews ──
# Social media crawlers and search engines that don't execute JS.
# When $is_bot = 1, article/profile requests are proxied to FastAPI
# which returns HTML with <meta property="og:*"> tags instead of the SPA shell.
map $http_user_agent $is_bot {
    default 0;
    ~*Telegrambot          1;
    ~*Twitterbot           1;
    ~*facebookexternalhit  1;
    ~*LinkedInBot          1;
    ~*Slackbot             1;
    ~*Discordbot           1;
    ~*WhatsApp             1;
    ~*vkShare              1;
    ~*Googlebot            1;
    ~*bingbot              1;
    ~*YandexBot            1;
    ~*Applebot             1;
    ~*PetalBot             1;
}

# HTTP — redirect to HTTPS + ACME challenge
server {
    listen 80;
    server_name type-club.ru www.type-club.ru;
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name type-club.ru www.type-club.ru;

    ssl_certificate     /etc/letsencrypt/live/type-club.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/type-club.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=30s;

    # ── Security & Limits ──
    client_max_body_size 15m;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "0" always;

    location = /downloads/latest.json {
        alias /usr/share/nginx/downloads/latest.json;
        add_header Cache-Control "no-cache";
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        root /usr/share/nginx/type-club;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Bot-aware SPA fallback ──
    # For bots: proxy to FastAPI OG endpoint to get meta tags
    # For users: serve the SPA as usual
    location / {
        set $backend http://type-club-backend:8000;

        if ($is_bot) {
            rewrite ^/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)$ /api/og/$1/$2 break;
            rewrite ^/([a-zA-Z0-9_-]+)$ /api/og/$1 break;
            proxy_pass $backend;
        }

        root /usr/share/nginx/type-club;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-XSS-Protection "0" always;
    }

    location /api/ {
        set $backend http://type-club-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend http://type-club-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    location /collab/ {
        set $collab_upstream http://type-club-collab:8001;
        proxy_pass $collab_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
