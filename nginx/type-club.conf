# HTTP — redirect to HTTPS + ACME challenge
server {
    listen 80;
    server_name type-club.ru www.type-club.ru;
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name type-club.ru www.type-club.ru;

    ssl_certificate     /etc/letsencrypt/live/type-club.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/type-club.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=30s;

    location = /downloads/latest.json {
        alias /usr/share/nginx/downloads/latest.json;
        add_header Cache-Control "no-cache";
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        root /usr/share/nginx/type-club;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://type-club-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
