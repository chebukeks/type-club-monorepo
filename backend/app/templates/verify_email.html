<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Inter, -apple-system, sans-serif; background: #1a1b1e; color: #e1e1e3; padding: 40px 20px;">
  <div style="max-width: 480px; margin: 0 auto; background: #1e1f22; border-radius: 16px; padding: 36px; border: 1px solid #2d2e32; text-align: center;">
    <h1 style="font-size: 24px; margin: 0 0 12px; color: #e8eaed; font-weight: 700;">Type Club</h1>
    <h2 style="font-size: 18px; margin: 0 0 16px; color: #e1e1e3; font-weight: 600;">Подтверждение регистрации</h2>
    <p style="font-size: 15px; line-height: 1.6; color: #a0a4ab; margin: 0 0 28px;">
      Здравствуйте, <strong>{{ nickname }}</strong>! Для завершения регистрации введите следующий 6-значный код в приложении:
    </p>
    <div style="display: inline-block; padding: 16px 36px; background: #25272c; border: 2px solid #6c8cff; border-radius: 12px; letter-spacing: 8px; font-family: 'Fira Code', Consolas, monospace; font-size: 32px; font-weight: 700; color: #6c8cff; margin: 0 auto 24px;">
      {{ code }}
    </div>
    <p style="font-size: 13px; color: #a0a4ab; margin: 0 0 8px;">
      Код действителен в течение 15 минут.
    </p>
    <p style="font-size: 13px; color: #6a6e78; margin: 24px 0 0;">
      Если вы не регистрировались в Type Club, просто проигнорируйте это письмо.
    </p>
  </div>
</body>
</html>
