<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Inter, -apple-system, sans-serif; background: #1a1b1e; color: #e1e1e3; padding: 40px 20px;">
  <div style="max-width: 480px; margin: 0 auto; background: #1e1f22; border-radius: 12px; padding: 32px; border: 1px solid #2d2e32;">
    <h1 style="font-size: 24px; margin: 0 0 16px; color: #e8eaed;">Welcome to Type Club, {{ nickname }}!</h1>
    <p style="font-size: 15px; line-height: 1.6; color: #a0a4ab; margin: 0 0 24px;">
      Thanks for creating an account. Please verify your email address to get started.
    </p>
    <a href="{{ link }}" style="display: inline-block; padding: 12px 32px; background: #6c8cff; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px;">
      Verify Email
    </a>
    <p style="font-size: 13px; color: #6a6e78; margin: 24px 0 0;">
      If you didn't create this account, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
